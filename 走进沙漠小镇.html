<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>走进沙漠小镇 · 第一人称</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0f1923;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#ece8e1;}
  #c{display:block;}
  #cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;}
  #cross::before,#cross::after{content:"";position:absolute;background:rgba(255,255,255,.85);}
  #cross::before{width:2px;height:14px;left:-1px;top:-7px;}
  #cross::after{height:2px;width:14px;top:-1px;left:-7px;}
  #lock{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(15,25,35,.82);cursor:pointer;text-align:center;}
  #lock h2{font-size:30px;letter-spacing:3px;margin:0 0 10px;}
  #lock p{color:#9fb0bc;letter-spacing:2px;margin:4px;}
  #lock .red{color:#ff4655;}
  .mbtn{display:block;margin:12px auto 0;min-width:220px;padding:13px 22px;border:none;cursor:pointer;
    font-family:inherit;font-size:17px;letter-spacing:2px;color:#fff;background:rgba(255,70,85,.18);
    clip-path:polygon(0 0,100% 0,100% 100%,14px 100%,0 calc(100% - 14px));transition:.15s;}
  .mbtn:hover{background:#ff4655;}
  #hint{position:fixed;left:18px;bottom:16px;z-index:3;color:#9fb0bc;font-size:14px;letter-spacing:1px;
    background:rgba(15,25,35,.5);padding:8px 12px;border-radius:6px;}
  #err{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;
    background:#0f1923;color:#ff4655;font-size:18px;padding:30px;}
</style>
</head>
<body>
  <div id="cross"></div>
  <div id="hint">W A S D 移动　·　鼠标 转头看　·　Esc 暂停</div>
  <div id="lock" style="display:none">
    <div id="pauseBox">
      <h2>已暂停</h2>
      <button class="mbtn" id="resumeBtn">继续游戏</button>
      <button class="mbtn" id="menuBtn">返回主菜单</button>
    </div>
  </div>
  <div id="err">需要联网才能加载 3D 引擎，请连上网络后刷新。</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const MAP=[
  {"type":"tspawn","x":420,"y":30,"w":160,"h":50},{"type":"ctspawn","x":420,"y":680,"w":160,"h":50},
  {"type":"barrier","x":420,"y":86,"w":160,"h":16},{"type":"barrier","x":420,"y":658,"w":160,"h":16},
  {"type":"A","x":70,"y":290,"w":210,"h":180},{"type":"B","x":720,"y":290,"w":210,"h":180},
  {"type":"house","x":455,"y":335,"w":90,"h":90,"rot":0.78,"hh":9},
  {"type":"house","x":430,"y":252,"w":140,"h":26,"hh":1.4},{"type":"house","x":430,"y":482,"w":140,"h":26,"hh":1.4},
  {"type":"house","x":320,"y":300,"w":55,"h":170,"rot":0.18,"hh":4.5},{"type":"house","x":625,"y":300,"w":55,"h":170,"rot":-0.18,"hh":4.5},
  {"type":"house","x":150,"y":150,"w":160,"h":70,"rot":-0.22,"hh":3.8},{"type":"house","x":690,"y":150,"w":160,"h":70,"rot":0.22,"hh":3.8},
  {"type":"house","x":420,"y":158,"w":160,"h":30,"hh":1.4},
  {"type":"house","x":150,"y":540,"w":160,"h":70,"rot":0.22,"hh":3.8},{"type":"house","x":690,"y":540,"w":160,"h":70,"rot":-0.22,"hh":3.8},
  {"type":"house","x":420,"y":572,"w":160,"h":30,"hh":1.4},
  {"type":"house","x":105,"y":300,"w":30,"h":120,"hh":2.4},{"type":"house","x":865,"y":300,"w":30,"h":120,"hh":2.4},
  {"type":"house","x":195,"y":405,"w":90,"h":26,"rot":0.3,"hh":1.5},{"type":"house","x":715,"y":405,"w":90,"h":26,"rot":-0.3,"hh":1.5},
  {"type":"crate","x":130,"y":360,"w":32,"h":32},{"type":"crate","x":838,"y":360,"w":32,"h":32},
  {"type":"crate","x":230,"y":330,"w":32,"h":32,"rot":0.4},{"type":"crate","x":738,"y":330,"w":32,"h":32,"rot":-0.4},
  {"type":"crate","x":400,"y":360,"w":32,"h":32,"rot":0.3},{"type":"crate","x":568,"y":360,"w":32,"h":32,"rot":-0.3},
  {"type":"crate","x":300,"y":205,"w":32,"h":32},{"type":"crate","x":668,"y":205,"w":32,"h":32},
  {"type":"crate","x":300,"y":525,"w":32,"h":32},{"type":"crate","x":668,"y":525,"w":32,"h":32}
];
const MW=1000, MH=760, DIV=8;
const HGT={house:3.8, barrier:1.6, crate:1.7, wall:4.6};
// 2D地图坐标 → 3D世界坐标
const wx=(x)=>(x-MW/2)/DIV, wz=(y)=>(y-MH/2)/DIV;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ec6e6);
scene.fog=new THREE.Fog(0x9ec6e6, 55, 165);

const camera=new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 1.7, wz(705));

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.domElement.id='c';
document.body.appendChild(renderer.domElement);

// ===== 灯光 + 影子 =====
const sun=new THREE.DirectionalLight(0xfff1d8, 2.6);
sun.position.set(52, 75, 34);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=230;
sun.shadow.camera.left=-70; sun.shadow.camera.right=70;
sun.shadow.camera.top=56; sun.shadow.camera.bottom=-56;
sun.shadow.bias=-0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd6ef, 0x6b5236, 0.7));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

// ===== 地面（接收影子）=====
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(MW/DIV+6, MH/DIV+6),
  new THREE.MeshStandardMaterial({color:0xd8c290, roughness:1})
);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true;
scene.add(ground);

// ===== 方块（房子/箱子/屏障）=====
const MAT={
  house:  new THREE.MeshStandardMaterial({color:0xcbac74, roughness:0.95}),
  tower:  new THREE.MeshStandardMaterial({color:0xa9854f, roughness:0.9}),
  lowwall:new THREE.MeshStandardMaterial({color:0xddc78f, roughness:1}),
  crate:  new THREE.MeshStandardMaterial({color:0x9a6b37, roughness:0.85}),
  barrier:new THREE.MeshStandardMaterial({color:0x5aa6dd, roughness:0.4, transparent:true, opacity:0.6}),
  wall:   new THREE.MeshStandardMaterial({color:0x8a6a45, roughness:1}),
};
function houseMat(hh){ return hh>=7 ? MAT.tower : (hh<=1.6 ? MAT.lowwall : MAT.house); }
const colliders=[];
function addBox(cx,cz,w,d,h,mat,roty){
  roty=roty||0;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(cx, h/2, cz); m.rotation.y=roty; m.castShadow=true; m.receiveShadow=true;
  scene.add(m);
  colliders.push({cx, cz, hw:w/2, hd:d/2, rot:roty});
}
for(const it of MAP){
  const roty=-(it.rot||0);
  if(it.type==='house'){
    const hh=it.hh!==undefined?it.hh:3.8;
    addBox(wx(it.x+it.w/2), wz(it.y+it.h/2), it.w/DIV, it.h/DIV, hh, houseMat(hh), roty);
  }else if(it.type==='crate'){
    addBox(wx(it.x+it.w/2), wz(it.y+it.h/2), it.w/DIV, it.h/DIV, HGT.crate, MAT.crate, roty);
  }else if(it.type==='barrier'){
    addBox(wx(it.x+it.w/2), wz(it.y+it.h/2), it.w/DIV, it.h/DIV, HGT.barrier, MAT.barrier, roty);
  }
}
// 四面围墙
const MWW=MW/DIV, MHH=MH/DIV;
addBox(0, -MHH/2, MWW, 0.6, HGT.wall, MAT.wall, 0);
addBox(0,  MHH/2, MWW, 0.6, HGT.wall, MAT.wall, 0);
addBox(-MWW/2, 0, 0.6, MHH, HGT.wall, MAT.wall, 0);
addBox( MWW/2, 0, 0.6, MHH, HGT.wall, MAT.wall, 0);

// ===== A/B 点地面标记 + 漂浮字母 =====
function siteMarker(it){
  const mk=new THREE.Mesh(
    new THREE.PlaneGeometry(it.w/DIV, it.h/DIV),
    new THREE.MeshBasicMaterial({color:0xff4655, transparent:true, opacity:0.22})
  );
  mk.rotation.x=-Math.PI/2; mk.position.set(wx(it.x+it.w/2), 0.03, wz(it.y+it.h/2));
  scene.add(mk);
  // 字母牌
  const cn=document.createElement('canvas'); cn.width=cn.height=128;
  const cx2=cn.getContext('2d');
  cx2.fillStyle='#ff4655'; cx2.font='bold 96px sans-serif';
  cx2.textAlign='center'; cx2.textBaseline='middle'; cx2.fillText(it.type,64,68);
  const tex=new THREE.CanvasTexture(cn);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true}));
  sp.position.set(wx(it.x+it.w/2), 2.4, wz(it.y+it.h/2)); sp.scale.set(2,2,2);
  scene.add(sp);
}
for(const it of MAP){ if(it.type==='A'||it.type==='B') siteMarker(it); }

// 出生点地面色块
function spawnPad(it,color){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(it.w/DIV,it.h/DIV),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.25}));
  p.rotation.x=-Math.PI/2; p.position.set(wx(it.x+it.w/2),0.02,wz(it.y+it.h/2));
  scene.add(p);
}
for(const it of MAP){
  if(it.type==='tspawn') spawnPad(it,0xff4655);
  if(it.type==='ctspawn') spawnPad(it,0x5ab0d0);
}

// ===== 第一人称控制 =====
const controls=new PointerLockControls(camera, renderer.domElement);
const lock=document.getElementById('lock');
let paused=false;
renderer.domElement.addEventListener('click',()=>controls.lock());
lock.addEventListener('click',()=>controls.lock());
document.getElementById('resumeBtn').addEventListener('click',e=>{e.stopPropagation();controls.lock();});
document.getElementById('menuBtn').addEventListener('click',e=>{e.stopPropagation();location.href='index.html';});
controls.addEventListener('lock',()=>{ paused=false; lock.style.display='none'; });
controls.addEventListener('unlock',()=>{ paused=true; lock.style.display='flex'; });
scene.add(controls.getObject());

const keys={};
addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const R=0.45;
function blocked(x,z){
  if(x<-MWW/2+R||x>MWW/2-R||z<-MHH/2+R||z>MHH/2-R) return true;
  for(const b of colliders){
    const dx=x-b.cx, dz=z-b.cz;
    const c=Math.cos(b.rot), s=Math.sin(b.rot);
    const lx= dx*c - dz*s;   // 把点转回盒子的本地坐标系（与网格旋转一致）
    const lz= dx*s + dz*c;
    if(Math.abs(lx)<b.hw+R && Math.abs(lz)<b.hd+R) return true;
  }
  return false;
}

const clock=new THREE.Clock();
const fwd=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  if(!paused){
    camera.getWorldDirection(fwd); fwd.y=0; fwd.normalize();
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    const mv=new THREE.Vector3();
    if(keys.KeyW) mv.add(fwd);
    if(keys.KeyS) mv.sub(fwd);
    if(keys.KeyD) mv.add(right);
    if(keys.KeyA) mv.sub(right);
    if(mv.lengthSq()>0){
      mv.normalize().multiplyScalar(6.2*dt);
      const o=controls.getObject();
      if(!blocked(o.position.x+mv.x, o.position.z)) o.position.x+=mv.x;
      if(!blocked(o.position.x, o.position.z+mv.z)) o.position.z+=mv.z;
    }
  }
  renderer.render(scene,camera);
}
animate();

// 3D 引擎没加载出来（没网）时提示
setTimeout(()=>{ if(!window.THREE_OK){} },1);
window.THREE_OK=true;
</script>
<script>
// 若模块脚本因离线没跑起来，3秒后显示提示
setTimeout(function(){ if(!window.THREE_OK){ document.getElementById('err').style.display='flex'; } },3000);
</script>
</body>
</html>
