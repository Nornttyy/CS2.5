<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙漠小镇 · 战术地图</title>
<style>
  :root{ --bg:#0f1923; --red:#ff4655; --blue:#5ab0d0; --cream:#ece8e1; --dim:#7a8b96; }
  body{margin:0;background:var(--bg);color:var(--cream);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:22px;}
  h1{font-size:24px;margin:4px;letter-spacing:2px;}
  .sub{color:var(--dim);letter-spacing:2px;margin-bottom:18px;font-size:14px;}
  .frame{background:#0b121a;padding:14px;border-radius:14px;border:1px solid #1d2b35;box-shadow:0 10px 40px #0008;}
  canvas{display:block;border-radius:8px;}
  .legend{display:flex;flex-wrap:wrap;gap:12px 22px;max-width:780px;margin-top:18px;font-size:14px;color:#cbd5dc;}
  .legend div{display:flex;align-items:center;gap:8px;}
  .sw{width:20px;height:20px;border-radius:4px;border:1px solid #0006;}
  .note{max-width:760px;margin-top:18px;color:var(--dim);font-size:14px;line-height:1.7;}
  .note b{color:var(--cream);}
</style>
</head>
<body>
  <h1>沙漠小镇 · 战术地图</h1>
  <div class="sub">对称双点 · 第一人称射击</div>

  <div class="frame"><canvas id="map" width="760" height="580"></canvas></div>

  <div class="legend">
    <div><span class="sw" style="background:rgba(255,70,85,.18);border-color:var(--red)"></span> 进攻方出生</div>
    <div><span class="sw" style="background:rgba(90,176,208,.18);border-color:var(--blue)"></span> 防守方出生</div>
    <div><span class="sw" style="background:rgba(255,70,85,.12);border-color:var(--red)"></span> 炸弹点 A / B</div>
    <div><span class="sw" style="background:#2e3a44;border-color:#44525e"></span> 建筑（掩体/挡视线）</div>
    <div><span class="sw" style="background:#3c4a55"></span> 木箱（小掩体）</div>
    <div><span class="sw" style="background:var(--red)"></span> 开局屏障</div>
  </div>

  <div class="note">
    <b>设计思路：</b>整张图左右<b>完全对称</b>，两边绝对公平。
    进攻方（上）和防守方（下）各有三条路：<b>去 A、走中路、去 B</b>。
    中路有一座建筑挡住，逼大家绕两侧打；A、B 两个炸弹点各被建筑和木箱围着，方便防守也方便埋伏。
    A 和 B 之间有<b>中路横向连接</b>，防守方可以快速<b>转点</b>支援。
  </div>

<script>
const MAP=[
  {"type":"route","x1":380,"y1":68,"x2":160,"y2":215},{"type":"route","x1":380,"y1":68,"x2":380,"y2":255},
  {"type":"route","x1":380,"y1":68,"x2":600,"y2":215},{"type":"route","x1":380,"y1":512,"x2":160,"y2":365},
  {"type":"route","x1":380,"y1":512,"x2":380,"y2":325},{"type":"route","x1":380,"y1":512,"x2":600,"y2":365},
  {"type":"route","x1":225,"y1":290,"x2":345,"y2":290},{"type":"route","x1":535,"y1":290,"x2":415,"y2":290},
  {"type":"tspawn","x":300,"y":20,"w":160,"h":48},{"type":"ctspawn","x":300,"y":512,"w":160,"h":48},
  {"type":"barrier","x":300,"y":74,"w":160,"h":16},{"type":"barrier","x":300,"y":490,"w":160,"h":16},
  {"type":"A","x":40,"y":215,"w":185,"h":150},{"type":"B","x":535,"y":215,"w":185,"h":150},
  {"type":"house","x":340,"y":255,"w":80,"h":80,"rot":0.78},
  {"type":"house","x":248,"y":230,"w":50,"h":125,"rot":0.20},{"type":"house","x":462,"y":230,"w":50,"h":125,"rot":-0.20},
  {"type":"house","x":95,"y":100,"w":130,"h":55,"rot":-0.30},{"type":"house","x":535,"y":100,"w":130,"h":55,"rot":0.30},
  {"type":"house","x":95,"y":425,"w":130,"h":55,"rot":0.30},{"type":"house","x":535,"y":425,"w":130,"h":55,"rot":-0.30},
  {"type":"house","x":300,"y":155,"w":65,"h":42,"rot":0.55},{"type":"house","x":395,"y":383,"w":65,"h":42,"rot":-0.55},
  {"type":"crate","x":78,"y":250,"w":52,"h":52,"rot":0.40},{"type":"crate","x":630,"y":250,"w":52,"h":52,"rot":-0.40},
  {"type":"crate","x":150,"y":315,"w":52,"h":52},{"type":"crate","x":558,"y":315,"w":52,"h":52},
  {"type":"crate","x":290,"y":215,"w":52,"h":52,"rot":0.30},{"type":"crate","x":418,"y":215,"w":52,"h":52,"rot":-0.30},
  {"type":"crate","x":290,"y":335,"w":52,"h":52},{"type":"crate","x":418,"y":335,"w":52,"h":52},
  {"type":"crate","x":195,"y":150,"w":52,"h":52,"rot":-0.60},{"type":"crate","x":513,"y":150,"w":52,"h":52,"rot":0.60},
  {"type":"crate","x":195,"y":400,"w":52,"h":52},{"type":"crate","x":513,"y":400,"w":52,"h":52}
];

const cv=document.getElementById('map'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;

// 底图
ctx.fillStyle='#11202b'; ctx.fillRect(0,0,W,H);
// 可走区域（沙地，压暗）
ctx.fillStyle='#2a3b3a'; ctx.fillRect(8,8,W-16,H-16);
ctx.strokeStyle='#37505a'; ctx.lineWidth=4; ctx.strokeRect(8,8,W-16,H-16);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// 路线
ctx.strokeStyle='rgba(236,232,225,.16)'; ctx.lineWidth=3; ctx.setLineDash([10,8]);
for(const it of MAP){ if(it.type==='route'){
  ctx.beginPath(); ctx.moveTo(it.x1,it.y1); ctx.lineTo(it.x2,it.y2); ctx.stroke(); } }
ctx.setLineDash([]);

// 建筑/木箱（支持旋转角度）
function drawRotBox(it,fill,stroke,lw,rad){
  ctx.save();
  ctx.translate(it.x+it.w/2, it.y+it.h/2);
  if(it.rot) ctx.rotate(it.rot);
  ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=lw;
  rr(-it.w/2,-it.h/2,it.w,it.h,rad); ctx.fill(); ctx.stroke();
  ctx.restore();
}
for(const it of MAP){
  if(it.type==='house') drawRotBox(it,'#2e3a44','#44525e',2,5);
  if(it.type==='crate') drawRotBox(it,'#3c4a55','#55636e',1.5,3);
}

// 炸弹点
for(const it of MAP){ if(it.type==='A'||it.type==='B'){
  ctx.fillStyle='rgba(255,70,85,.10)'; ctx.strokeStyle='#ff4655'; ctx.lineWidth=3; ctx.setLineDash([12,7]);
  rr(it.x,it.y,it.w,it.h,8); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,70,85,.85)'; ctx.font='bold 64px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(it.type, it.x+it.w/2, it.y+it.h/2); } }

// 出生点
for(const it of MAP){
  if(it.type==='tspawn'||it.type==='ctspawn'){
    const atk=it.type==='tspawn';
    ctx.fillStyle=atk?'rgba(255,70,85,.18)':'rgba(90,176,208,.18)';
    ctx.strokeStyle=atk?'#ff4655':'#5ab0d0'; ctx.lineWidth=2;
    rr(it.x,it.y,it.w,it.h,6); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#ece8e1'; ctx.font='15px "Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(atk?'进攻方':'防守方', it.x+it.w/2, it.y+it.h/2);
  }
  if(it.type==='barrier'){ ctx.fillStyle='rgba(255,70,85,.55)';
    rr(it.x,it.y,it.w,it.h,3); ctx.fill(); }
}
</script>
</body>
</html>
